<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three Boolean operators with their meanings." viewBox="0 0 1200 160" style="font-family:Arial,Helvetica,sans-serif"><rect x="15.0" y="12" width="356.6666666666667" height="126" rx="12" fill="#fcfcfa" stroke="#225a83" stroke-width="2"/><text x="193.33333333333334" y="48" text-anchor="middle" font-size="25" fill="#225a83" font-weight="700">AND</text><text x="193.33333333333334" y="103" text-anchor="middle" font-size="30" fill="#193148" font-weight="700">Both true</text><rect x="421.6666666666667" y="12" width="356.6666666666667" height="126" rx="12" fill="#fcfcfa" stroke="#225a83" stroke-width="2"/><text x="600.0" y="48" text-anchor="middle" font-size="25" fill="#225a83" font-weight="700">OR</text><text x="600.0" y="103" text-anchor="middle" font-size="30" fill="#193148" font-weight="700">One or both true</text><rect x="828.3333333333334" y="12" width="356.6666666666667" height="126" rx="12" fill="#fcfcfa" stroke="#225a83" stroke-width="2"/><text x="1006.6666666666667" y="48" text-anchor="middle" font-size="25" fill="#225a83" font-weight="700">NOT</text><text x="1006.6666666666667" y="103" text-anchor="middle" font-size="30" fill="#193148" font-weight="700">Reverse true / false</text></svg>